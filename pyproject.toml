[project]
name = "ai-agent-platform"
version = "0.1.0"
description = "Day 1 FastAPI, PostgreSQL and Redis foundation for an AI Agent platform"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.34,<1.0",
  "sqlalchemy[asyncio]>=2.0,<3.0",
  "asyncpg>=0.30,<1.0",
  "redis>=5.2,<6.0",
  "pydantic-settings>=2.7,<3.0",
  "email-validator>=2.3.0",
  "pwdlib[argon2]>=0.3.0",
  "pyjwt>=2.13.0",
  "openai>=1.0,<2.0",
  "cryptography>=44,<46",
]

[dependency-groups]
dev = [
  "httpx>=0.28,<1.0",
  "pytest>=8.3,<9.0",
  "pytest-asyncio>=0.25,<1.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["backend"]
